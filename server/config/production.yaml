logger:
  enable: true
  level: info
  format: json
server:
  binding: 0.0.0.0
  port: <%= get_env(name="PORT", default="8080") %>
  host: http://localhost
  middlewares:
    etag:
      enable: false
    fallback:
      enable: false
    secure_headers:
      enable: true
      preset: empty
      overrides:
        Cache-Control: no-store
        X-Content-Type-Options: nosniff
workers:
  mode: BackgroundAsync
database:
  # Supplied by workload identity before connecting.
  uri: ""
  enable_logging: false
  min_connections: 1
  max_connections: 10
  connect_timeout: 30000
  idle_timeout: 300000
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
  run_on_start: CREATE SCHEMA IF NOT EXISTS library
settings:
  oidc:
    issuer: ""
    audience: ""
  openai:
    base_url: https://api.openai.com/v1
    api_key: ""
    model: gpt-5
    timeout_seconds: 120
  storage_directory: <%= get_env(name="STORAGE_DIRECTORY") %>
  loan_period_days: 28
  import:
    poll_ms: 1000
    min_job_interval_ms: 2000
    max_attempts: 5
    retry_base_ms: 5000
    retry_max_ms: 300000
    stale_seconds: 300
    completed_visibility_seconds: 60
    retention_seconds: 604800
    sweep_seconds: 60
