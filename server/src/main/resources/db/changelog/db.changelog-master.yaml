databaseChangeLog:
  - changeSet:
      id: 1-create-loan-items-table
      author: mucsi96
      changes:
        - createTable:
            tableName: loan_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: barcode
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: media_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: text
              - column:
                  name: category
                  type: text
              - column:
                  name: library
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: text
              - column:
                  name: completed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
  - changeSet:
      id: 2-add-isbn-and-thumbnail-url
      author: mucsi96
      changes:
        - addColumn:
            tableName: loan_items
            columns:
              - column:
                  name: isbn
                  type: text
              - column:
                  name: thumbnail_url
                  type: text
  - changeSet:
      id: 3-photo-import
      author: mucsi96
      changes:
        - dropColumn:
            tableName: loan_items
            columns:
              - column:
                  name: barcode
              - column:
                  name: category
              - column:
                  name: note
              - column:
                  name: thumbnail_url
        - dropNotNullConstraint:
            tableName: loan_items
            columnName: library
            columnDataType: text
        - addUniqueConstraint:
            tableName: loan_items
            columnNames: isbn
            constraintName: uq_loan_items_isbn
  - changeSet:
      id: 4-replace-completed-with-status
      author: mucsi96
      changes:
        - addColumn:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  type: text
        - update:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  value: READ
            where: completed = true
        - update:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  value: LOANED
            where: completed = false
        - addNotNullConstraint:
            tableName: loan_items
            columnName: status
            columnDataType: text
        - dropColumn:
            tableName: loan_items
            columnName: completed
  - changeSet:
      id: 5-split-returned-status
      author: mucsi96
      changes:
        - update:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  value: UNREAD_RETURNED
            where: status = 'RETURNED'
