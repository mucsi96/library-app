databaseChangeLog:
  - changeSet:
      id: 1-create-loan-items-table
      author: mucsi96
      changes:
        - createTable:
            tableName: loan_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: barcode
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: media_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: text
              - column:
                  name: category
                  type: text
              - column:
                  name: library
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: text
              - column:
                  name: completed
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
  - changeSet:
      id: 2-add-isbn-and-thumbnail-url
      author: mucsi96
      changes:
        - addColumn:
            tableName: loan_items
            columns:
              - column:
                  name: isbn
                  type: text
              - column:
                  name: thumbnail_url
                  type: text
  - changeSet:
      id: 3-photo-import
      author: mucsi96
      changes:
        - dropColumn:
            tableName: loan_items
            columns:
              - column:
                  name: barcode
              - column:
                  name: category
              - column:
                  name: note
              - column:
                  name: thumbnail_url
        - dropNotNullConstraint:
            tableName: loan_items
            columnName: library
            columnDataType: text
        - addUniqueConstraint:
            tableName: loan_items
            columnNames: isbn
            constraintName: uq_loan_items_isbn
  - changeSet:
      id: 4-replace-completed-with-status
      author: mucsi96
      changes:
        - addColumn:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  type: text
        - update:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  value: READ
            where: completed = true
        - update:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  value: LOANED
            where: completed = false
        - addNotNullConstraint:
            tableName: loan_items
            columnName: status
            columnDataType: text
        - dropColumn:
            tableName: loan_items
            columnName: completed
  - changeSet:
      id: 5-split-returned-status
      author: mucsi96
      changes:
        - update:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  value: UNREAD_RETURNED
            where: status = 'RETURNED'
  - changeSet:
      id: 6-import-jobs
      author: mucsi96
      changes:
        - createTable:
            tableName: import_jobs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: reference
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_import_jobs_reference
              - column:
                  name: status
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: front_photo
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: back_photo
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: isbn
                  type: text
              - column:
                  name: title
                  type: text
              - column:
                  name: author
                  type: text
              - column:
                  name: media_type
                  type: text
              - column:
                  name: library
                  type: text
              - column:
                  name: loan_item_id
                  type: bigint
              - column:
                  name: error_detail
                  type: text
              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: next_attempt_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: import_jobs
            baseColumnNames: loan_item_id
            referencedTableName: loan_items
            referencedColumnNames: id
            constraintName: fk_import_jobs_loan_item
            onDelete: SET NULL
        - createIndex:
            tableName: import_jobs
            indexName: idx_import_jobs_claim
            columns:
              - column:
                  name: status
              - column:
                  name: next_attempt_at
        - createIndex:
            tableName: import_jobs
            indexName: idx_import_jobs_created_at
            columns:
              - column:
                  name: created_at
  - changeSet:
      id: 7-ai-pacer
      author: mucsi96
      changes:
        - createTable:
            tableName: ai_pacer
            columns:
              - column:
                  name: id
                  type: smallint
                  constraints:
                    primaryKey: true
              - column:
                  name: next_call_allowed_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - insert:
            tableName: ai_pacer
            columns:
              - column:
                  name: id
                  valueNumeric: 1
  - changeSet:
      id: 8-libraries-and-own-items
      author: mucsi96
      changes:
        - createTable:
            tableName: libraries
            columns:
              - column:
                  name: id
                  type: text
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_libraries_name
        # The branches items were already borrowed from become the initial
        # predefined list, keyed by a slug of their name.
        - sql:
            sql: >-
              INSERT INTO library.libraries (id, name)
              SELECT btrim(lower(regexp_replace(library, '[^a-zA-Z0-9]+', '-', 'g')), '-'), library
              FROM (SELECT DISTINCT library FROM library.loan_items WHERE library IS NOT NULL) AS branches
        # Own items have no due date.
        - dropNotNullConstraint:
            tableName: loan_items
            columnName: due_date
            columnDataType: date
  - changeSet:
      id: 9-own-items-start-unread
      author: mucsi96
      changes:
        # Own items used to start as READING even though the user had not
        # opened them; an untouched own item is UNREAD from now on.
        - update:
            tableName: loan_items
            columns:
              - column:
                  name: status
                  value: UNREAD
            where: library IS NULL AND status = 'READING'
