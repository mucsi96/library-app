# Tight timings so the E2E suite exercises the queue without waiting on
# production-scale pacing.
import:
  poll-interval: PT0.2S
  min-job-interval: PT0.2S
  max-attempts: 3
  retry-base-delay: PT0.5S
  retry-max-delay: PT2S
  stale-after: PT30S
  sweep-interval: PT5S
spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8050/default
          audiences: mock-api-client-id
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
