apiVersion: v1
kind: Pod
metadata:
  name: library-app-test
spec:
  containers:
    - name: traefik
      image: docker.io/library/traefik:v3.6
      ports:
        - containerPort: 80
          hostPort: 8150
        - containerPort: 8081
          hostPort: 8151
      volumeMounts:
        - name: traefik-config
          mountPath: /etc/traefik/traefik.yaml
          readOnly: true
        - name: traefik-routes
          mountPath: /etc/traefik/routes.yaml
          readOnly: true
      livenessProbe:
        exec:
          command: ["traefik", "healthcheck", "--ping"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: db
      image: docker.io/library/postgres:17.5-bullseye
      ports:
        - containerPort: 5432
          hostPort: 5451
      env:
        - name: POSTGRES_DB
          value: test
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_USER
          value: postgres
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 5

    - name: mock-oauth2
      image: ghcr.io/mucsi96/mock-oidc-provider:14
      ports:
        - containerPort: 8050
          hostPort: 8050
      env:
        - name: PORT
          value: "8050"
        - name: ISSUER_ID
          value: default
        - name: SUB
          value: test-user
        - name: OID
          value: 00000000-0000-0000-0000-000000000001
        - name: NAME
          value: Test User
        - name: PREFERRED_USERNAME
          value: test-user@example.com
        - name: ROLES
          value: readItems,writeItems
        - name: SCP
          value: api-access
        - name: AUD
          value: mock-api-client-id
      livenessProbe:
        httpGet:
          path: /health
          port: 8050
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: mock-openai
      image: localhost/library-app-mock-openai:test
      ports:
        - containerPort: 3070
          hostPort: 3070
      env:
        - name: PORT
          value: "3070"
      livenessProbe:
        httpGet:
          path: /health
          port: 3070
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: server
      image: localhost/library-app-server:test
      # Rootless Podman's host-mounted fixtures belong to the invoking user.
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: storage
          mountPath: /app/storage
      env:
        - name: STORAGE_DIRECTORY
          value: /app/storage
        - name: OPENAI_API_KEY
          value: mock-key
        - name: OPENAI_BASE_URL
          value: http://localhost:3070
        - name: LOCO_ENV
          value: test
        - name: BINDING
          value: 0.0.0.0
        - name: PORT
          value: "8054"
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@localhost:5432/test
        - name: OIDC_ISSUER
          value: http://localhost:8050/default
        - name: API_CLIENT_ID
          value: mock-api-client-id
      livenessProbe:
        exec:
          command: ["/app/library-server", "--healthcheck"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 30

    - name: client
      image: docker.io/library/nginx:1.31.8
      volumeMounts:
        - name: client-dist
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: client-nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          readOnly: true
      livenessProbe:
        httpGet:
          path: /
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 2
        failureThreshold: 10

  volumes:
    - name: client-dist
      hostPath:
        path: client/dist
        type: Directory
    - name: client-nginx-config
      hostPath:
        path: client/nginx.conf
        type: File
    - name: traefik-config
      hostPath:
        path: test/traefik.yaml
        type: File
    - name: traefik-routes
      hostPath:
        path: test/traefik-routes.yaml
        type: File
    - name: storage
      hostPath:
        path: test/storage
        type: DirectoryOrCreate
