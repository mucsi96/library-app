@if (thumbnail.isLoading()) {
<div class="cover cover-skeleton" [class.cover-large]="size() === 'large'"></div>
} @else if (thumbnail.value(); as url) {
<img
  class="cover"
  [class.cover-large]="size() === 'large'"
  [src]="url"
  [alt]="coverLabel()"
/>
} @else {
<div class="cover cover-placeholder" [class.cover-large]="size() === 'large'">
  <mat-icon aria-hidden="true">{{
    item().mediaType === 'CD' ? 'album' : 'menu_book'
  }}</mat-icon>
</div>
}
